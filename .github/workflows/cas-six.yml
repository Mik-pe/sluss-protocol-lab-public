name: Synthetic guarded CAS
on: workflow_dispatch
permissions:
  contents: write
jobs:
  guarded_cas:
    runs-on: ubuntu-latest
    steps:
      - name: Submit exact synthetic ref guards
        env:
          GH_TOKEN: ${{ github.token }}
          CAS_PAYLOAD: ""
        run: |
          printf '%s' "$CAS_PAYLOAD" | base64 --decode > "$RUNNER_TEMP/cas.json"
          gh api graphql --input "$RUNNER_TEMP/cas.json"
