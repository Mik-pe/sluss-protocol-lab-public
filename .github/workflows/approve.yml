name: Synthetic protocol reviewer
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Synthetic lab PR number
        required: true
        type: string
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve selected synthetic lab PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) exit 1;; esac
          gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" -f event=APPROVE -f body='Synthetic protocol experiment review.'
