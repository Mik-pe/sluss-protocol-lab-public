name: Synthetic protocol batch reviewer
on:
  workflow_dispatch:
    inputs:
      prs:
        description: Comma-separated synthetic lab PR numbers
        required: true
        type: string
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve synthetic lab PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBERS: ${{ inputs.prs }}
        run: |
          case "$PR_NUMBERS" in ''|*[!0-9,]*|,*|*,|*,,*) exit 1;; esac
          IFS=',' read -r -a prs <<< "$PR_NUMBERS"
          for pr in "${prs[@]}"; do
            gh api --method POST "repos/$REPO/pulls/$pr/reviews" -f event=APPROVE -f body='Synthetic protocol experiment review.' >/dev/null
          done
